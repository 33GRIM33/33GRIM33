<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 174">
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#938bdc" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#736eb9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6569ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .shade { animation: drift 5.8s ease-in-out infinite }
    .motes { animation: flicker 4.6s ease-in-out infinite }
    @keyframes drift { 50% { transform: translate(-3px,-7px) } }
    @keyframes flicker { 50% { opacity:.36; transform:translateY(-4px) } }
    @media (prefers-reduced-motion: reduce) { .shade,.motes { animation:none } }
  </style>
  <ellipse cx="95" cy="89" rx="92" ry="75" fill="url(#halo)"/>
  <g class="motes" fill="#b1b9f6">
    <circle cx="30" cy="107" r="2"/>
    <circle cx="138" cy="43" r="1.8"/>
    <circle cx="156" cy="114" r="2.2"/>
  </g>
  <image class="shade" x="39" y="37" width="117" height="94" xlink:href="data:image/png;base64,"/>
</svg>

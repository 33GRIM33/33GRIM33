<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 152">
  <title>What I’m exploring</title>
  <desc>I’m learning Rust and trying out ML ideas in Python. I like reading just enough docs to give something a go. This usually ends with eleven more docs tabs.</desc>
  <style></style>
  <defs><clipPath id="card-edge"><rect width="390" height="152" rx="8"/></clipPath></defs>
  <rect x=".5" y=".5" width="389" height="151" rx="8" fill="#101620" stroke="#344056"/>
  <g clip-path="url(#card-edge)"><svg x="0" y="0" width="112" height="34" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 48">
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#a8b9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a8b9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .flicker { animation: glow 3.8s ease-in-out infinite }
    .late { animation-delay: -1.8s }
    .spark { animation: rise 4.1s ease-in-out infinite }
    @keyframes glow { 50% {opacity:.5} }
    @keyframes rise { 50% {transform:translateY(-3px);opacity:.34} }
    @media (prefers-reduced-motion: reduce) {
      .flicker,.spark { animation:none }
    }
  </style>
  <path d="M0 1h156M20 1q23 4 34 20m77-20q-17 3-25 12" fill="none" stroke="#7688a5" opacity=".7"/>
  <path d="m26 4 4-3 4 3-4 3zm94 0 4-3 4 3-4 3z" fill="#8f9eb7"/>
  <path d="M57 1v20m34-20v12m20-12v16" fill="none" stroke="#b0a5c7" stroke-dasharray="1 2" stroke-linecap="round"/>
  <g class="flicker late">
    <circle cx="57" cy="33" r="21" fill="url(#glow)"/>
    <circle cx="91" cy="24" r="13" fill="url(#glow)"/>
  </g>
  <path d="M57 20q8 6 9 11l-2 8-7 6-7-6-2-8z" fill="#4d517e" stroke="#aeb0d2"/>
  <path d="m57 25-4 6 4 9 4-9z" fill="#dfb1de" stroke="#f0d8ee" stroke-width=".75"/>
  <path d="M49 33h16m-8-12v23m-2 1h4" fill="none" stroke="#e3d7ef" stroke-width=".75" opacity=".78"/>
  <path d="M91 13l-5 6 5 12 5-12z" fill="#b580b2" stroke="#ecc5eb" stroke-width=".8"/>
  <path d="M111 16l-3 4 3 6 3-6z" fill="#91acd1" stroke="#cfdef1" stroke-width=".65"/>
  <g class="spark late" fill="#e6bdde">
    <circle cx="38" cy="34" r="1.2"/><circle cx="75" cy="43" r="1"/>
    <path d="m124 29 2-2 2 2-2 2z"/>
  </g>
</svg></g>
  <path d="M309 1V151M10 62H299" stroke="#344056"/>
  <svg x="317" y="50" width="65" height="51" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 214 168">
  <defs>
    <linearGradient id="panel" x2="0.8" y2="1">
      <stop stop-color="#172437"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#acabe5" stop-opacity=".83"/>
      <stop offset=".58" stop-color="#7786c8" stop-opacity=".49"/>
      <stop offset="1" stop-color="#626faa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .shade { transform-box:fill-box; transform-origin:center; animation:glide 3s ease-in-out infinite }
    .particle { animation:rise 2.2s ease-out infinite }
    .delayed { animation-delay:-1.15s }
    .wisp { animation:trail 3s ease-out infinite }
    @keyframes glide {
      30% { transform:translate(-8px,-9px) rotate(-6deg) }
      68% { transform:translate(6px,-3px) rotate(4deg) }
    }
    @keyframes rise {
      from { opacity:0; transform:translate(6px,7px) }
      35% { opacity:.95 }
      to { opacity:0; transform:translate(-8px,-15px) }
    }
    @keyframes trail {
      0%,100% { opacity:.05; transform:translateX(-5px) }
      35% { opacity:.45 }
      75% { opacity:.12; transform:translateX(7px) }
    }
    @media (prefers-reduced-motion: reduce) { .shade,.particle,.wisp { animation:none } }
  </style>
  <rect x="1" y="1" width="212" height="166" rx="14" fill="url(#panel)" stroke="#34435c"/>
  <ellipse cx="105" cy="85" rx="104" ry="78" fill="url(#halo)"/>
  <g class="wisp" fill="none" stroke="#aebce6" stroke-width="1.4" stroke-linecap="round" opacity=".3">
    <path d="M158 88q16-7 32-2m-30 14q18-3 29 2"/>
  </g>
  <g fill="#c6d3ff" opacity=".7">
    <circle class="particle" cx="38" cy="95" r="2.4"/>
    <circle class="particle delayed" cx="167" cy="52" r="2"/>
    <circle class="particle" cx="187" cy="105" r="1.6"/>
    <circle class="particle delayed" cx="31" cy="126" r="1.5"/>
    <circle class="particle" cx="147" cy="134" r="1.9"/>
  </g>
  <image class="shade" x="29" y="24" width="154" height="124" xlink:href="data:image/png;base64,"/>
  <g fill="#aa719f" stroke="#e1abcf" stroke-width=".85" stroke-linejoin="round">
    <path d="M173 1v23m16-23v16" fill="none" stroke="#8383a9" stroke-dasharray="2 2"/>
    <circle cx="173" cy="23" r="1.5" fill="#ead4e7"/>
    <path d="M173 25l-5 7 2 9 3 4 4-4 2-9z"/>
    <path d="M173 25v9l4 7 2-9z" fill="#674b77" stroke-width=".6"/>
    <path d="M189 18l-3 4 1 5 2 3 3-3 1-5z" opacity=".7"/>
    <path d="M22 151l-2-15 3-8 7 6 1 17zM32 151l2-12 4-5 5 6-3 11z" opacity=".68"/>
  </g>
  <circle class="particle delayed" cx="177" cy="52" r="2.1" fill="#efadd9"/>
  <circle class="particle" cx="46" cy="135" r="1.7" fill="#efadd9"/>
</svg>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="10" y="52" fill="#eef0fa" font-size="17" font-weight="650">What I’m exploring</text>
    <g fill="#cfdaeb" font-size="13">
      <text x="10" y="78">I’m learning Rust and trying out ML ideas in</text>
<text x="10" y="96">Python. I like reading just enough docs to give</text>
<text x="10" y="114">something a go. This usually ends with eleven</text>
<text x="10" y="132">more docs tabs.</text>
    </g>
  </g>
</svg>
